name: Build Engine Sound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 29 and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;34.0.0"

      - name: Apply custom auto-start project
        run: |
          unzip -o engine-sound-autostart.zip -d /tmp/engine-sound-autostart
          cp -a /tmp/engine-sound-autostart/apps/engine-sound/. apps/engine-sound/

      - name: Build engine-sound.apk
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          export PATH="$BT:$PATH"
          export AAPT2="$BT/aapt2"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-29/android.jar"
          bash apps/engine-sound/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-sound-apk
          path: apps/engine-sound/build/engine-sound.apk
          if-no-files-found: error
