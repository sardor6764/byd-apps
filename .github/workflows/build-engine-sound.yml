name: Build Engine Sound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 29 and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;34.0.0"

      - name: Build engine-sound.apk
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          export PATH="$BT:$PATH"
          export AAPT2="$BT/aapt2"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-29/android.jar"
          bash apps/engine-sound/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: engine-sound-apk
          path: .github/workflows/build-engine-sound.yml
